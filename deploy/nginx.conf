upstream lunwentocode {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name lunwentocode.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lunwentocode.example.com;

    ssl_certificate     /etc/letsencrypt/live/lunwentocode.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lunwentocode.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 必须 ≥ 后端 MAX_UPLOAD_MB（默认 20MB），留 1.6 倍余量给数据文件
    client_max_body_size 32m;

    # SSE 进度流：必须关闭缓冲，否则实时进度会被缓存住
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 大文件直接流式转发，不在 Nginx 落临时文件
    proxy_request_buffering off;

    location / {
        proxy_pass http://lunwentocode;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 需要保持连接，空 Connection 头可避免不必要的关闭
        proxy_set_header Connection "";
    }

    # 站点展示页
    location /site/ {
        proxy_pass http://lunwentocode;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态资源
    location /static/ {
        proxy_pass http://lunwentocode;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/lunwentocode.access.log;
    error_log  /var/log/nginx/lunwentocode.error.log;
}
