# 论文章节模板（期刊/学位论文式）
# 定位：研究生撰写自己的论文初稿，代码用于实验验证
# 占位符在 workflow 中替换: {thesis_title} {thesis_info} {tasks_overview} {comparison_info}
# {section_title} {paper_section} {source_excerpt}
# {coder_summary} {code_output} {images_prompt} {section_number}

[firstPage]
firstPage = """
# {thesis_title}

## 摘要

第一段：研究背景与研究问题（约80-120字）。

第二段：本文方法概述——系统模型、关键技术路线与主要设计（约120字）。

第三段：实验验证概述——实验设置、关键结果与代表性数值，数值须来自代码真实输出（约100字）。
若某实验失败，如实说明该部分未经数值验证。

第四段：结论与意义（约60字）。

**关键词**：从原文提取或概括3-5个关键词，用分号分隔

参考信息：
{thesis_info}

任务概览（各章节的实验支撑情况）：
{tasks_overview}

各章节实验结果汇总（摘要中的实验数值必须来自此处，禁止编造）：
{comparison_info}
"""

[introduction]
introduction = """
# 1 引言

## 1.1 研究背景与意义
阐述研究领域背景、现实需求与研究价值（论文级段落，2-3段）。

## 1.2 相关研究现状
简要综述该方向的主要技术路线与研究进展，指出已有方法存在的不足或未解决的问题。

## 1.3 本文贡献
本文的主要工作与创新点（3-4条，段落式陈述，不使用列表）。

## 1.4 文章组织
后续各章的内容安排。

参考信息：
{thesis_info}

任务概览：
{tasks_overview}
"""

[task_section]
task_section = """
# {section_title}

以本文第一作者口吻撰写本章论文正文（对应研究方案的「{paper_section}」部分）。

写作要求：
1. 先介绍本章的模型、方法或实验设计；公式用 $$...$$ 呈现，符号与方案原文保持一致
2. 模型描述可以基于方案原文素材改写润色，但不得凭空增加原文没有的技术内容
3. 实验部分所有数值必须来自代码真实输出，禁止编造；关键参数注明来源（方案给定/自行设定）
4. 章节结尾自然过渡到下一部分，不出现"本任务""复现"等字样
5. 语言为规范学术书面语，句式凝练，段落式写作，禁止分点列表

方案原文素材（本章相关的可引用改写）：
{source_excerpt}

代码实验总结：
{coder_summary}

代码输出摘录（数值的唯一合法来源）：
{code_output}

{images_prompt}
"""

[conclusion]
conclusion = """
# {section_number} 结论

第一段：总结本文的研究工作与提出的方法（论文级段落）。

第二段：概括实验验证的主要结果，引用关键数值（来自代码输出）。

第三段：指出本文的局限性与后续研究方向。

参考信息（各章节实验结果汇总）：
{comparison_info}
"""
