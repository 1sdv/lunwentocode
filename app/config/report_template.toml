# 复现报告章节模板
# 占位符在 workflow 中替换: {thesis_info} {tasks_overview} {thesis_title}
# {section_title} {paper_section} {paper_results} {coder_summary} {code_output}
# {images_prompt} {comparison_info}

[firstPage]
firstPage = """
# 标题：基于《{thesis_title}》的论文复现报告

## 摘要

第一段：论文背景与研究内容概述（约100字）。

第二段：复现范围与方法概述——复现了哪些任务、采用什么技术路线、执行环境（约120字）。

第三段：总体复现结果概述——各任务完成情况、关键指标与论文原结果的对比结论（约120字）。

第四段：主要发现与差异分析结论（约80字）。

**关键词**：论文复现  方法复现  数据分析  结果对比

参考信息：
{thesis_info}

复现任务概览：
{tasks_overview}
"""

[overview]
overview = """
# 一、复现概述

## 1.1 论文信息
论文标题、类型、研究方法、核心内容的简要介绍。

## 1.2 复现范围
说明本次复现覆盖了论文的哪些部分（方法、实验、图表），哪些部分未复现及原因。

## 1.3 复现环境
执行环境说明：Python + Jupyter 内核，主要依赖库，数据文件说明。

参考信息：
{thesis_info}

复现任务概览：
{tasks_overview}
"""

[method_mapping]
method_mapping = """
# 二、方法复现对照

用表格对照论文章节与复现实现：

| 论文章节 | 论文方法 | 复现实现 | 代码位置 |
|---------|---------|---------|---------|
| ... | ... | ... | notebook 任务N |

逐行说明每个论文章节对应的复现实现方式、使用的库与关键参数，
以及实现与论文方法的差异（如有简化或替代，说明原因）。

参考信息：
{tasks_overview}
"""

[task_section]
task_section = """
# {section_title}

## 对应论文章节：{paper_section}

### 方法实现
说明本任务复现的方法、步骤与关键参数（参数需注明来源）。

### 执行结果
基于代码真实输出描述结果，所有数值必须来自代码输出，禁止编造。
用表格或文字呈现关键指标。

### 结果图表
插入代码生成的所有图片并逐图解读（每图至少3行分析）。

### 与论文结果对比
论文报告的结果：{paper_results}
复现得到的结果：基于代码输出填写。
分析一致性与偏差及可能原因。

参考信息（代码手总结）：
{coder_summary}

代码输出摘录：
{code_output}

{images_prompt}
"""

[comparison]
comparison = """
# 三、整体结果对比

汇总所有任务的复现结果与论文报告结果的对比表：

| 任务 | 论文结果 | 复现结果 | 一致性 |
|------|---------|---------|-------|

对整体一致性给出结论，分析主要偏差来源
（数据差异/参数未公开/实现细节简化/随机性等）。

参考信息：
{comparison_info}
"""

[issues]
issues = """
# 四、差异分析与问题记录

记录复现过程中遇到的问题、采取的简化处理及其影响：
1. 问题/差异描述
2. 原因分析
3. 对结果的影响评估
4. 改进建议

如代码执行中有失败的任务，如实记录失败原因与已尝试的方案。

参考信息：
{comparison_info}
"""

[conclusion]
conclusion = """
# 五、结论

## 5.1 复现结论
总体评价论文方法可复现性与结果一致性（含具体数值支撑）。

## 5.2 复现资产
复现代码（notebook.ipynb）与图表资产的使用说明。

## 5.3 局限与展望
本次复现的局限性与后续改进方向。

参考信息：
{thesis_info}

{comparison_info}
"""
